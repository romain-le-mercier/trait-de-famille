<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Trois crayons de couleur">
  <!-- La feuille blanche : le fond du produit, et le seul moyen de garder du
       contraste quel que soit le thème de l'onglet. -->
  <rect width="32" height="32" rx="7" fill="#ffffff"/>
  <g transform="translate(16 16) scale(0.9) translate(-16 -16)"
     stroke="#201b2e" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">

    <!-- Crayon gauche — cerise -->
    <g transform="translate(5 2.5) rotate(-16)">
      <path d="M0 0 L4 7 H-4 Z" fill="#d93a4a" stroke="none"/>
      <path d="M4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="#ff4b5c" stroke="none"/>
      <path d="M0 0 L4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="none"/>
      <path d="M-4 7 H4" fill="none"/>
    </g>

    <!-- Crayon droit — ciel -->
    <g transform="translate(27 2.5) rotate(16)">
      <path d="M0 0 L4 7 H-4 Z" fill="#1f7fd6" stroke="none"/>
      <path d="M4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="#3aa0ff" stroke="none"/>
      <path d="M0 0 L4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="none"/>
      <path d="M-4 7 H4" fill="none"/>
    </g>

    <!-- Crayon central — soleil. Dessiné en dernier : il passe devant. -->
    <g transform="translate(16 1.5)">
      <path d="M0 0 L4 7 H-4 Z" fill="#eeb100" stroke="none"/>
      <path d="M4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="#ffd23f" stroke="none"/>
      <path d="M0 0 L4 7 V25 A2 2 0 0 1 2 27 H-2 A2 2 0 0 1 -4 25 V7 Z" fill="none"/>
      <path d="M-4 7 H4" fill="none"/>
    </g>
  </g>
</svg>
